\u5230\u4F4D\u4EE5\u540E\u8FC5\u901F\u5165\u961F\uFF0C\u51C6\u5907\u4E0A\u8F66`},{id:"q26",category:"dialogue",group:"all",text:"\u60C5\u666F\u8BBE\u7F6E\uFF1A\u4F60\u4EEC\u5C0F\u7EC4\u7684\u670D\u52A1\u65F6\u95F4\u6BD4\u539F\u5B9A\u8BA1\u5212\u5EF6\u957F\u4E86\uFF0C\u90E8\u5206\u5FD7\u613F\u8005\u5F00\u59CB\u75B2\u60EB\u3001\u62B1\u6028\uFF0C\u4F60\u4F1A\u5982\u4F55\u5E26\u52A8\u5927\u5BB6\uFF1F\uFF08\u9762\u8BD5\u5B98\u53EF\u4EE5\u4F5C\u4E3A\u6B63\u5728\u62B1\u6028\u7684\u961F\u53CB\uFF09",answer:"\uFF08\u6211\u4F1A\u4E3B\u52A8\u9F13\u52B1\u8EAB\u8FB9\u7684\u540C\u4F34\uFF0C\u544A\u8BC9\u5927\u5BB6\u518D\u575A\u6301\u4E00\u4E0B\uFF0C\u9009\u624B\u4EEC\u4E5F\u5728\u52AA\u529B\u51B2\u523A\uFF0C\u6211\u4EEC\u7684\u670D\u52A1\u5BF9\u4ED6\u4EEC\u5F88\u91CD\u8981\u3002\u540C\u65F6\u4E3B\u52A8\u591A\u5206\u62C5\u4E00\u4E9B\u5DE5\u4F5C\uFF0C\u7528\u79EF\u6781\u7684\u6001\u5EA6\u5E26\u52A8\u5927\u5BB6\uFF0C\u670D\u4ECE\u7EC4\u957F\u5B89\u6392\uFF0C\u786E\u4FDD\u7AD9\u597D\u6700\u540E\u4E00\u73ED\u5C97\u3002\uFF09"},{id:"q27",category:"dialogue",group:"all",text:"\u60C5\u666F\u8BBE\u7F6E\uFF1A\u5982\u679C\u4F60\u5728\u996E\u6599\u7AD9\uFF0C\u53C2\u8D5B\u8005\u5728\u53D6\u6C34\u8FC7\u7A0B\u4E2D\u78B0\u5012\u4E86\u5F88\u591A\u7EB8\u676F\uFF0C\u7EB8\u676F\u548C\u996E\u6599\u5728\u8D5B\u9053\u4E0A\u7FFB\u6D12\u4E00\u5730\uFF0C\u4ED6\u9A82\u9A82\u54A7\u54A7\u5730\u8DD1\u8D70\u4E86\u3002\u6B64\u65F6\u4F60\u4F1A\u600E\u4E48\u505A\uFF1F\uFF08\u5BF9\u7740\u961F\u53CB\u8BF4\uFF0C\u9762\u8BD5\u5B98\u53EF\u4EE5\u626E\u6F14\u961F\u53CB\uFF09",answer:"\uFF08\u544A\u8BC9\u961F\u53CB\u7EE7\u7EED\u5B8C\u6210\u5DE5\u4F5C\uFF0C\u53CA\u65F6\u6574\u7406\u684C\u9762\u5E76\u8865\u5145\u684C\u9762\u4E0A\u7684\u996E\u6599\uFF1B\u5B89\u629A\u961F\u53CB\u7684\u60C5\u7EEA\uFF1B\uFF09"},{id:"q28",category:"dialogue",group:"all",text:"\u60C5\u666F\u8BBE\u7F6E\uFF1A\u6BD4\u8D5B\u63A5\u8FD1\u5C3E\u58F0\u4E86\uFF0C\u6B64\u65F6\u8DEF\u8FB9\u7684\u89C2\u4F17\u5411\u4F60\u7D22\u8981\u591A\u4F59\u7684\u7269\u8D44\uFF08\u5982\u6D77\u7EF5\u3001\u6C34\u3001\u98DF\u7269\u7B49\uFF09\uFF0C\u4F60\u4F1A\u600E\u4E48\u505A\uFF1F\uFF08\u9762\u8BD5\u5B98\u53EF\u626E\u6F14\u89C2\u4F17\uFF0C\u53EF\u4EE5\u6B7B\u7F20\u70C2\u6253\u4E00\u70B9\uFF09",answer:"\uFF08\u8868\u793A\u62D2\u7EDD\uFF0C\u8BF4\u660E\u7269\u8D44\u662F\u51C6\u5907\u7ED9\u9009\u624B\u51C6\u5907\u7684\uFF0C\u6001\u5EA6\u53EF\u4EE5\u5F3A\u786C\u4E00\u70B9\uFF1B\u5982\u679C\u6B7B\u7F20\u70C2\u6253\u5219\u5411\u88C1\u5224\u6C42\u52A9\uFF09"},{id:"q29",category:"dialogue",group:"all",text:"\u60C5\u666F\u8BBE\u7F6E\uFF1A\u4F60\u7684\u7EC4\u5458\u6CA1\u6709\u62A2\u5230\u60C5\u4FA3\u5FD7\u613F\u8005\u7684\u540D\u989D\uFF0C\u60F3\u8981\u8BA9\u4F60\u548C\u4ED6\u7684\u4F34\u4FA3\u4EA4\u6362\u4E00\u4E0B\u5DE5\u4F5C\u5C0F\u7EC4\uFF1A\u201C\u7EC4\u957F\u4E5F\u4E0D\u77E5\u9053\u8C01\u662F\u8C01\uFF0C\u5230\u65F6\u5019\u6211\u4EEC\u4E92\u76F8\u901A\u77E5\u5C31\u884C\u4E86\uFF01\u201D\uFF08\u9762\u8BD5\u5B98\u626E\u6F14\u7EC4\u5458\uFF09",answer:"(\u201C\u5C0F\u7EC4\u5B89\u6392\u8FD9\u4E8B\u4E5F\u4E0D\u662F\u6211\u4EEC\u60F3\u6362\u5C31\u80FD\u6362\u7684\uFF0C\u8FD9\u6837\u5F88\u5BB9\u6613\u51FA\u5DEE\u9519\uFF0C\u8FD8\u662F\u8DDF\u88C1\u5224\u548C\u5C0F\u7EC4\u957F\u8BF7\u793A\u4E00\u4E0B\u5427\u3002\u201D)"},{id:"q30",category:"dialogue",group:"all",text:"\u60C5\u666F\u8BBE\u7F6E\uFF1A\u5728\u53D1\u653E\u9009\u624B\u7684\u7269\u8D44\u5305\u65F6\uFF0C\u6709\u9009\u624B\u60F3\u591A\u9886\u4E00\u4EFD\u5E26\u7ED9\u670B\u53CB\uFF0C\u5E76\u8BF4\uFF1A\u201C\u6211\u670B\u53CB\u5C31\u5728\u540E\u9762\uFF0C\u4ED6\u8BA9\u6211\u5148\u5E2E\u4ED6\u9886\u3002\u201D\u4F60\u4F1A\u5982\u4F55\u5904\u7406\uFF1F\uFF08\u9762\u8BD5\u5B98\u626E\u6F14\u9009\u624B\uFF09",answer:"\uFF08\u201C\u62B1\u6B49\u5148\u751F/\u5973\u58EB\uFF0C\u7269\u8D44\u5305\u662F\u6309\u53C2\u8D5B\u9009\u624B\u4E25\u683C\u4E00\u4EBA\u4E00\u4EFD\u53D1\u653E\u7684\uFF0C\u9700\u8981\u60A8\u670B\u53CB\u4EB2\u81EA\u524D\u6765\u9886\u53D6\uFF0C\u6211\u4EEC\u53EF\u4EE5\u4E3A\u4ED6\u4FDD\u
